name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm typecheck
      - run: pnpm build

  backend:
    name: Backend tests and checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: python -m ruff check app tests scripts migrations
      - run: python -m alembic upgrade head --sql > "$RUNNER_TEMP/unknown-migrations.sql"
      - run: python -m pytest -q
      - name: Run end-to-end smoke against a fresh two-worker SQLite service
        shell: bash
        run: |
          BACKEND_WORKERS=2 python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 2 > "$RUNNER_TEMP/unknown-api.log" 2>&1 &
          CI_SERVER_PID=$!
          trap 'kill "$CI_SERVER_PID"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health/live > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health/ready > /dev/null
          SMOKE_ADMIN_PASSWORD=change-me-in-development python scripts/e2e_smoke.py --base-url http://127.0.0.1:8000 --class-code IX
          SMOKE_ADMIN_PASSWORD=change-me-in-development python scripts/quiz_soak_smoke.py --base-url http://127.0.0.1:8000 --class-code IX --iterations 2 --max-concurrency 2

  container:
    name: Backend production container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file backend/Dockerfile --tag unknown-api:ci .
      - name: Run container liveness smoke
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run --detach --publish 18000:8000 \
            --env BACKEND_ENVIRONMENT=development \
            --env BACKEND_WORKERS=2 \
            --env BACKEND_DATABASE_URL='mssql+aioodbc://ci.invalid/competition' \
            --env BACKEND_AUTH_SECRET='ci-only-container-secret' \
            --env BACKEND_ALLOW_DEV_ADMIN=true \
            --env BACKEND_CORS_ORIGINS='http://localhost:3000' \
            --env BACKEND_TRUSTED_HOSTS='localhost,127.0.0.1' \
            unknown-api:ci)
          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" >/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18000/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become live in time" >&2
          exit 1
