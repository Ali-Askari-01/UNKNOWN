services:
  - type: web
    name: unknown-web
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: corepack pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: FASTAPI_INTERNAL_URL
        sync: false
      - key: NEXT_PUBLIC_FASTAPI_WS_URL
        sync: false

  - type: web
    name: unknown-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: BACKEND_ENVIRONMENT
        value: production
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: BACKEND_WORKERS
        value: "1"
      - key: BACKEND_DATABASE_URL
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: BACKEND_TRUSTED_HOSTS
        sync: false
      - key: BACKEND_AUTH_SECRET
        generateValue: true
      - key: BACKEND_ADMIN_USERNAME
        sync: false
      - key: BACKEND_ADMIN_PASSWORD_HASH
        sync: false
      - key: BACKEND_ALLOW_DEV_ADMIN
        value: "false"
      - key: BACKEND_RUN_MIGRATIONS
        value: "false"
      - key: BACKEND_LOG_LEVEL
        value: INFO
