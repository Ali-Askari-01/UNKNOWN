[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unknown-fastapi-backend"
version = "0.1.0"
description = "FastAPI backend for the UNKNOWN TLC technology competition platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "alembic>=1.14,<2",
  "aioodbc>=0.5,<1",
  "pyodbc>=5.1,<6",
  "python-multipart>=0.0.9,<1",
  "bcrypt>=4.1,<5",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "openpyxl>=3.1,<4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
  # FastAPI dependency injection relies on Depends(...) in argument defaults.
  "B008",
]

[tool.setuptools.packages.find]
include = ["app*"]
